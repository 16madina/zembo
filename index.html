<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    
    <!-- App Info -->
    <title>ZEMBO — Live, découvre et connecte-toi</title>
    <meta name="description" content="ZEMBO — Live, découvre et connecte-toi avec ta communauté. Streams live, sessions vidéo networking et rencontres sociales." />
    <meta name="author" content="Zembo" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zembo" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Android Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0c14" />
    
    <!-- Prevent zoom on input focus (iOS) -->
    <meta name="HandheldFriendly" content="true" />
    
    <!-- OG Tags -->
    <meta property="og:title" content="ZEMBO — Live, découvre et connecte-toi" />
    <meta property="og:description" content="Live, découvre et connecte-toi avec ta communauté. Streams live et networking social." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Zembo" />
    
    <!-- Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Splash Screens & Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
